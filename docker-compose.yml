# Local development: the SpikeClip license API.
#
#   docker compose up --build      API on http://localhost:8080 (docs at /docs)
#
# The website runs with `cd frontend && npm run dev:web` (VITE_API_BASE=http://127.0.0.1:8080).

services:
  api:
    build: ./backend
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ADMIN_TOKEN: local-owner-token
      CORS_ORIGINS: http://localhost:5173
      SIGNUP: open
    volumes:
      - api-data:/app/data

volumes:
  api-data:
