# Render Blueprint: the SpikeClip web API (accounts, Paddle, licence keys).
#
# Clipping runs in the desktop app on each user's PC, so the server is small:
# no video, no queue, no disk. Keys live in Postgres (DATABASE_URL) — a free
# Neon / Supabase / Render Postgres works.
#
# The website is a static site on Vercel (frontend/), see DEPLOY.md.

services:
  - type: web
    name: spikeclip-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: https://spikeclip-app.vercel.app,https://spikeclip-eight.vercel.app
      - key: SIGNUP
        value: open
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: DOWNLOAD_WINDOWS_URL
        sync: false
      - key: DOWNLOAD_MAC_URL
        sync: false
      - key: APP_VERSION
        value: 2.1.0
