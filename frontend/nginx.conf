server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The app is a single page: every path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy is invisible until it expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
